AMT), AVG(r.UTILISATION) FROM PROD_DW.SALES_SUMMARY s JOIN PROD_DW.CREDIT_RISK r ON r.REGION_NM = s.REGION_NM GROUP BY 1\"\n1007,bi_svc,=T> JOB=BI_REFRESH;APP=ExecDashboard;,1,\"INSERT INTO PROD_DW.EXEC_DASHBOARD SELECT s.REGION_NM, SUM(s.AMT), AVG(r.UTILISATION) FROM PROD_DW.SALES_SUMMARY s JOIN PROD_DW.CREDIT_RISK r ON r.REGION_NM = s.REGION_NM GROUP BY 1\"\n","jcl/ACCTLOAD.jcl":"//ACCTLOAD JOB (ACCT),'ACCOUNT LOAD',CLASS=A,MSGCLASS=X\n//*  CORE BANKING ACCOUNT MASTER -> STAGING -> ACCOUNT DIMENSION\n//LOAD     EXEC PGM=FASTLOAD\n//ACCTIN   DD DSN=PROD.MF.ACCOUNT.MASTER(0),DISP=SHR\n//SYSIN    DD *\nLOGON tdprod/etl_user,xxxx;\nDEFINE ACCT_ID (CHAR(12)), CUST_ID (CHAR(10)), PRODUCT_CD (CHAR(4)),\n       OPEN_DT (CHAR(10)), CREDIT_LIMIT (CHAR(12)), STATUS_CD (CHAR(1))\n  FILE=ACCTIN;\nBEGIN LOADING PROD_STG.ACCOUNT_STG ERRORFILES PROD_STG.ACCOUNT_E1, PROD_STG.ACCOUNT_E2;\nINSERT INTO PROD_STG.ACCOUNT_STG VALUES (:ACCT_ID, :CUST_ID, :PRODUCT_CD, :OPEN_DT, :CREDIT_LIMIT, :STATUS_CD);\nEND LOADING;\nLOGOFF;\n/*\n//DIM      EXEC PGM=BTEQ\n//SYSIN    DD *\n.LOGON tdprod/etl_user,xxxx;\nMERGE INTO PROD_DW.ACCOUNT AS t\nUSING (\n  SEL a.ACCT_ID, c.CUST_ID, a.PRODUCT_CD, a.CREDIT_LIMIT, a.STATUS_CD\n  FROM PROD_STG.ACCOUNT_STG a\n  JOIN PROD_DW.CUSTOMER c ON c.CUST_ID = a.CUST_ID\n) AS s\nON t.ACCT_ID = s.ACCT_ID\nWHEN MATCHED THEN UPDATE SET CREDIT_LIMIT = s.CREDIT_LIMIT, STATUS_CD = s.STATUS_CD\nWHEN NOT MATCHED THEN INSERT VALUES (s.ACCT_ID, s.CUST_ID, s.PRODUCT_CD, s.CREDIT_LIMIT, s.STATUS_CD);\n.IF ERRORCODE <> 0 THEN .QUIT 8\n.LOGOFF\n/*\n","jcl/CUSTLOAD.jcl":"//CUSTLOAD JOB (ACCT),'CUSTOMER LOAD',CLASS=A,MSGCLASS=X\n//*--------------------------------------------------------------------\n//* LOAD CUSTOMER EXTRACT FROM CORE BANKING INTO STAGING, THEN DW\n//*--------------------------------------------------------------------\n//         SET ENV=PROD\n//STEP010  EXEC PGM=FASTLOAD\n//STEPLIB  DD DISP=SHR,DSN=TERADATA.UTILITY.LOADLIB\n//INFILE   DD DSN=&ENV..MF.CUSTOMER.EXTRACT(0),DISP=SHR\n//SYSPRINT DD SYSOUT=*\n//SYSIN    DD *\nLOGON tdprod/etl_user,xxxx;\nDEFINE CUST_ID (CHAR(10)), CUST_NM (CHAR(40)), REGION_CD (CHAR(3)), OPEN_DT (CHAR(10))\n  FILE=INFILE;\nBEGIN LOADING PROD_STG.CUSTOMER_STG ERRORFILES PROD_STG.CUSTOMER_E1, PROD_STG.CUSTOMER_E2;\nINSERT INTO PROD_STG.CUSTOMER_STG VALUES (:CUST_ID, :CUST_NM, :REGION_CD, :OPEN_DT);\nEND LOADING;\nLOGOFF;\n/*\n//STEP020  EXEC PGM=BTEQ\n//SYSPRINT DD SYSOUT=*\n//SYSIN    DD *\n.LOGON tdprod/etl_user,xxxx;\nDATABASE PROD_DW;\nDELETE FROM PROD_DW.CUSTOMER ALL;\nINSERT INTO PROD_DW.CUSTOMER (CUST_ID, CUST_NM, REGION_NM, OPEN_DT)\nSELECT s.CUST_ID, s.CUST_NM, r.REGION_NM, CAST(s.OPEN_DT AS DATE FORMAT 'YYYY-MM-DD')\nFROM PROD_STG.CUSTOMER_STG s\nLEFT JOIN REF.REGION r ON r.REGION_CD = s.REGION_CD;\n.IF ERRORCODE <> 0 THEN .QUIT 8\n.LOGOFF\n.QUIT 0\n/*\n","jcl/PAYLOAD.jcl":"//PAYLOAD  JOB (ACCT),'PAYMENTS LOAD',CLASS=A,MSGCLASS=X\n//*  DAILY CARD PAYMENTS VIA TPT, THEN BUILD THE PAYMENT FACT\n//TPT      EXEC PGM=TBUILD,PARM='-f DD:TPTIN'\n//PAYIN    DD DSN=PROD.MF.PAYMENTS.DAILY(0),DISP=SHR\n//TPTIN    DD DSN=PROD.TD.TPT(PAYTPT),DISP=SHR\n//FACT     EXEC PGM=BTEQ\n//SYSIN    DD *\n.LOGON tdprod/etl_user,xxxx;\nDELETE FROM PROD_DW.PAYMENT_FACT WHERE PAY_DT = CURRENT_DATE - 1;\nINSERT INTO PROD_DW.PAYMENT_FACT\nSELECT p.PAY_ID, a.ACCT_ID, a.CUST_ID, p.PAY_DT, p.AMOUNT, p.CHANNEL_CD\nFROM PROD_STG.PAYMENT_STG p\nJOIN PROD_DW.ACCOUNT a ON a.ACCT_ID = p.ACCT_ID;\n.LOGOFF\n/*\n","jcl/PRODLOAD.jcl":"//PRODLOAD JOB (ACCT),'PRODUCT LOAD',CLASS=A,MSGCLASS=X\n//TPTLOAD  EXEC PGM=TBUILD,PARM='-f DD:TPTIN'\n//PRODIN   DD DSN=PROD.MF.PRODUCT.MASTER,DISP=SHR\n//TPTIN    DD DSN=PROD.TD.TPT(PRODTPT),DISP=SHR\n//SYSPRINT DD SYSOUT=*\n//MERGE    EXEC PGM=BTEQ\n//SYSIN    DD *\n.LOGON tdprod/etl_user,xxxx;\nMERGE INTO PROD_DW.PRODUCT AS t\nUSING (SEL PROD_CD, PROD_NM, CATEGORY FROM PROD_STG.PRODUCT_STG) AS s\nON t.PROD_CD = s.PROD_CD\nWHEN MATCHED THEN UPDATE SET PROD_NM = s.PROD_NM, CATEGORY = s.CATEGORY\nWHEN NOT MATCHED THEN INSERT (PROD_CD, PROD_NM, CATEGORY) VALUES (s.PROD_CD, s.PROD_NM, s.CATEGORY);\n.LOGOFF\n/*\n","jcl/SALESRPT.jcl":"//SALESRPT JOB (ACCT),'SALES REPORTING',CLASS=A,MSGCLASS=X\n//BUILD    EXEC PGM=BTEQ\n//SUMOUT   DD DSN=PROD.MF.SALES.SUMMARY(+1),DISP=(NEW,CATLG),UNIT=SYSDA\n//SYSIN    DD *\n.LOGON tdprod/rpt_user,xxxx;\nDELETE FROM PROD_DW.SALES_SUMMARY ALL;\nINSERT INTO PROD_DW.SALES_SUMMARY\nSELECT f.REGION_NM, f.CATEGORY, f.ORD_DT, SUM(f.AMT), SUM(f.QTY)\nFROM PROD_DW.ORDER_FACT f\nGROUP BY 1, 2, 3;\n\nREPLACE VIEW PROD_DW.V_SALES_BY_REGION AS\nLOCKING ROW FOR ACCESS\nSELECT REGION_NM, SUM(AMT) AS AMT FROM PROD_DW.SALES_SUMMARY GROUP BY 1;\n\n.EXPORT DATA FILE=SUMOUT\nSELECT * FROM PROD_DW.SALES_SUMMARY;\n.EXPORT RESET\n.LOGOFF\n/*\n","scheduler/ca7.csv":"job,predecessor,schedule,description\nCUSTLOAD,,DAILY 01:00,Customer extract load\nPRODLOAD,,DAILY 01:30,Product master load\nACCTLOAD,CUSTLOAD,DAILY 01:45,Account master load\nORDLOAD,CUSTLOAD PRODLOAD,DAILY 02:00,Orders stage and fact\nPAYLOAD,ACCTLOAD,DAILY 02:15,Card payments load\nSALESRPT,ORDLOAD,DAILY 03:30,Sales summary and extract\nRISKRPT,PAYLOAD ORDLOAD,DAILY 04:00,Credit risk scores and collections feed\n","scripts/ORDFACT.bteq":".LOGON tdprod/etl_user,xxxx;\n-- build the order fact from staged orders; customers and products enrich the rows\nCREATE VOLATILE TABLE vt_orders AS (\n  SELECT o.ORDER_ID, o.CUST_ID, o.PROD_CD, o.QTY, o.AMT, o.ORD_DT\n  FROM PROD_STG.ORDERS_STG o\n  WHERE o.ORD_DT >= CURRENT_DATE - 7\n) WITH DATA ON COMMIT PRESERVE ROWS;\n\nDELETE FROM PROD_DW.ORDER_FACT WHERE ORD_DT >= CURRENT_DATE - 7;\n\nINSERT INTO PROD_DW.ORDER_FACT\nSELECT v.ORDER_ID, c.CUST_ID, c.REGION_NM, p.PROD_CD, p.CATEGORY, v.QTY, v.AMT, v.ORD_DT\nFROM vt_orders v\nJOIN PROD_DW.CUSTOMER c ON c.CUST_ID = v.CUST_ID\nJOIN PROD_DW.PRODUCT  p ON p.PROD_CD = v.PROD_CD;\n.IF ERRORCODE <> 0 THEN .QUIT 8\n.LOGOFF\n","scripts/ORDSTG.mload":".LOGON tdprod/etl_user,xxxx;\n.BEGIN IMPORT MLOAD TABLES PROD_STG.ORDERS_STG\n    WORKTABLES PROD_STG.ORDERS_WT\n    ERRORTABLES PROD_STG.ORDERS_ET PROD_STG.ORDERS_UV;\n.LAYOUT ORDLAYOUT;\n.FIELD ORDER_ID * CHAR(12);\n.FIELD CUST_ID  * CHAR(10);\n.FIELD PROD_CD  * CHAR(8);\n.FIELD QTY      * CHAR(6);\n.FIELD AMT      * CHAR(12);\n.FIELD ORD_DT   * CHAR(10);\n.DML LABEL INSORD;\nINSERT INTO PROD_STG.ORDERS_STG VALUES (:ORDER_ID, :CUST_ID, :PROD_CD, :QTY, :AMT, :ORD_DT);\n.IMPORT INFILE ORDIN LAYOUT ORDLAYOUT APPLY INSORD;\n.END MLOAD;\n.LOGOFF;\n","scripts/PAYTPT.tpt":"DEFINE JOB LOAD_PAYMENT_STG\nDESCRIPTION 'Load daily card payments into staging'\n(\n  DEFINE OPERATOR PAY_READER\n  TYPE DATACONNECTOR PRODUCER\n  SCHEMA *\n  ATTRIBUTES (VARCHAR FileName = 'DD:PAYIN', VARCHAR Format = 'Formatted');\n\n  DEFINE OPERATOR PAY_LOAD\n  TYPE UPDATE\n  SCHEMA *\n  ATTRIBUTES (VARCHAR TargetTable = 'PROD_STG.PAYMENT_STG', VARCHAR LogTable = 'PROD_STG.PAYMENT_LG');\n\n  APPLY ('INSERT INTO PROD_STG.PAYMENT_STG VALUES (:PAY_ID, :ACCT_ID, :PAY_DT, :AMOUNT, :CHANNEL_CD);')\n  TO OPERATOR (PAY_LOAD[2])\n  SELECT * FROM OPERATOR (PAY_READER[2]);\n);\n","scripts/PRODTPT.tpt":"DEFINE JOB LOAD_PRODUCT_STG\nDESCRIPTION 'Load product master into staging'\n(\n  DEFINE SCHEMA PRODUCT_SCHEMA (PROD_CD VARCHAR(8), PROD_NM VARCHAR(60), CATEGORY VARCHAR(20));\n\n  DEFINE OPERATOR FILE_READER\n  TYPE DATACONNECTOR PRODUCER\n  SCHEMA PRODUCT_SCHEMA\n  ATTRIBUTES (VARCHAR FileName = 'DD:PRODIN', VARCHAR Format = 'Delimited', VARCHAR OpenMode = 'Read');\n\n  DEFINE OPERATOR LOAD_OP\n  TYPE LOAD\n  SCHEMA *\n  ATTRIBUTES (VARCHAR TargetTable = 'PROD_STG.PRODUCT_STG', VARCHAR LogTable = 'PROD_STG.PRODUCT_LG');\n\n  APPLY ('INSERT INTO PROD_STG.PRODUCT_STG (:PROD_CD, :PROD_NM, :CATEGORY);')\n  TO OPERATOR (LOAD_OP[1])\n  SELECT * FROM OPERATOR (FILE_READER[1]);\n);\n","scripts/RISKCALC.bteq":".LOGON tdprod/risk_user,xxxx;\nDELETE FROM PROD_DW.CREDIT_RISK ALL;\n\nINSERT INTO PROD_DW.CREDIT_RISK\nSELECT a.ACCT_ID, c.CUST_ID, c.REGION_NM,\n       SUM(p.AMOUNT) / NULLIFZERO(a.CREDIT_LIMIT) AS UTILISATION,\n       COUNT(f.ORDER_ID) AS ORDERS_90D\nFROM PROD_DW.ACCOUNT a\nJOIN PROD_DW.CUSTOMER c ON c.CUST_ID = a.CUST_ID\nLEFT JOIN PROD_DW.PAYMENT_FACT p ON p.ACCT_ID = a.ACCT_ID\nLEFT JOIN PROD_DW.ORDER_FACT f ON f.CUST_ID = a.CUST_ID AND f.ORD_DT >= CURRENT_DATE - 90\nGROUP BY 1, 2, 3, a.CREDIT_LIMIT;\n\nREPLACE VIEW PROD_DW.V_HIGH_RISK_ACCOUNTS AS\nLOCKING ROW FOR ACCESS\nSELECT * FROM PROD_DW.CREDIT_RISK WHERE UTILISATION > 0.9;\n\n.EXPORT DATA FILE=RISKOUT\nSELECT ACCT_ID, UTILISATION FROM PROD_DW.CREDIT_RISK WHERE UTILISATION > 0.9;\n.EXPORT RESET\n.LOGOFF\n"}},"abinitio":{"nodes":[{"id":"job:acct_dim_build","type":"job","name":"acct_dim_build","attrs":{"file":"graphs/acct_dim_build.json","line":1,"description":"Account dimension","project":"/Projects/core_banking","steps":[{"name":"stg.account","pgm":"Input Table"},{"name":"Attach customer key","pgm":"Reformat"},{"name":"dw.account_dim","pgm":"Output Table"}],"schedule":"DAILY 01:20"}},{"id":"tbl:dw.account_dim","type":"table","name":"dw.account_dim","attrs":{"tableKind":"MANAGED_TABLE","location":"hdfs://nameservice1/warehouse/dw.db/account_dim","owner":"etl_svc","comment":"Account dimension","lastAltered":"2025-02-10"}},{"id":"tbl:dw.customer_dim","type":"table","name":"dw.customer_dim","attrs":{"tableKind":"MANAGED_TABLE","location":"hdfs://nameservice1/warehouse/dw.db/customer_dim","owner":"etl_svc","comment":"Customer dimension","lastAltered":"2025-02-10"}},{"id":"tbl:stg.account","type":"table","name":"stg.account","attrs":{"tableKind":"MANAGED_TABLE","location":"hdfs://nameservice1/warehouse/stg.db/account","owner":"etl_svc","comment":"Account master staging","lastAltered":"2025-01-14"}},{"id":"job:acct_ingest","type":"job","name":"acct_ingest","attrs":{"file":"graphs/acct_ingest.json","line":1,"description":"Account master landing","project":"/Projects/core_banking","steps":[{"name":"Account master feed","pgm":"Input File"},{"name":"Validate","pgm":"Reformat"} N_DATE}\" },\n  \"components\": [\n    { \"id\": \"in_cust\", \"name\": \"CRM customer feed\", \"type\": \"Input File\",\n      \"path\": \"hdfs://nameservice1${LANDING}/crm/customer/\" },\n    { \"id\": \"reformat\", \"name\": \"Standardise\", \"type\": \"Reformat\" },\n    { \"id\": \"dedup\", \"name\": \"Dedup on cust_id\", \"type\": \"Dedup Sorted\" },\n    { \"id\": \"out_stg\", \"name\": \"stg.customer\", \"type\": \"Output Table\", \"table\": \"stg.customer\" },\n    { \"id\": \"rej\", \"name\": \"Rejects\", \"type\": \"Output File\", \"path\": \"/data/${ENV}/rejects/crm/customer\" }\n  ],\n  \"flows\": [\n    { \"from\": \"in_cust\", \"to\": \"reformat\" },\n    { \"from\": \"reformat\", \"to\": \"dedup\" },\n    { \"from\": \"dedup\", \"to\": \"out_stg\" },\n    { \"from\": \"reformat\", \"to\": \"rej\" }\n  ]\n}\n","graphs/daily_risk.json":"{\n  \"graph\": \"daily_risk\",\n  \"project\": \"/Projects/risk\",\n  \"description\": \"Daily credit risk exposure mart (Hive SQL)\",\n  \"components\": [\n    { \"id\": \"risk_sql\", \"name\": \"Build exposure\", \"type\": \"Run SQL\",\n      \"sql\": \"INSERT OVERWRITE TABLE mart.risk_exposure PARTITION (dt='${RUN_DATE}')\\nSELECT c.segment, SUM(t.amount_usd) FROM `dw`.`txn_enriched` t JOIN dw.customer_dim c ON c.cust_id = t.cust_id GROUP BY c.segment\" }\n  ],\n  \"flows\": []\n}\n","graphs/fraud_score.json":"{\n  \"graph\": \"fraud_score\",\n  \"project\": \"/Projects/fraud\",\n  \"description\": \"Score enriched transactions and publish alerts to the case system\",\n  \"components\": [\n    { \"id\": \"in_txn\", \"name\": \"dw.txn_enriched\", \"type\": \"Input Table\", \"table\": \"dw.txn_enriched\" },\n    { \"id\": \"score\", \"name\": \"Score rules\", \"type\": \"Reformat\", \"lookups\": [\"dw.account_dim\"] },\n    { \"id\": \"filter\", \"name\": \"Score > 700\", \"type\": \"Filter by Expression\" },\n    { \"id\": \"out_alerts\", \"name\": \"mart.fraud_alerts\", \"type\": \"Output Table\", \"table\": \"mart.fraud_alerts\" },\n    { \"id\": \"out_feed\", \"name\": \"Case system feed\", \"type\": \"Output File\", \"path\": \"/data/prod/outbound/fraud/alerts\" }\n  ],\n  \"flows\": [[\"in_txn\", \"score\"], [\"score\", \"filter\"], [\"filter\", \"out_alerts\"], [\"filter\", \"out_feed\"]]\n}\n","graphs/marketing_segments.json":"{\n  \"graph\": \"marketing_segments\",\n  \"project\": \"/Projects/marketing\",\n  \"description\": \"Monthly customer segments (Hive SQL)\",\n  \"components\": [\n    { \"id\": \"seg_sql\", \"name\": \"Build segments\", \"type\": \"Run SQL\",\n      \"sql\": \"INSERT OVERWRITE TABLE mart.customer_segments\\nSELECT c.cust_id, CASE WHEN SUM(t.amount_usd) > 10000 THEN 'premium' ELSE 'core' END\\nFROM dw.customer_dim c LEFT JOIN dw.txn_enriched t ON t.cust_id = c.cust_id GROUP BY c.cust_id\" }\n  ],\n  \"flows\": []\n}\n","graphs/txn_enrich.json":"{\n  \"graph\": \"txn_enrich\",\n  \"project\": \"/Projects/payments\",\n  \"description\": \"Enrich transactions with customer attributes\",\n  \"components\": [\n    { \"id\": \"in_raw\", \"name\": \"raw.txn\", \"type\": \"Input Table\",\n      \"sql\": \"SELECT t.* FROM raw.txn t WHERE t.dt = '${RUN_DATE}'\" },\n    { \"id\": \"join\", \"name\": \"Join customer\", \"type\": \"Join\" },\n    { \"id\": \"in_cust\", \"name\": \"dw.customer_dim\", \"type\": \"Input Table\", \"table\": \"dw.customer_dim\" },\n    { \"id\": \"rollup\", \"name\": \"Currency normalise\", \"type\": \"Reformat\", \"lookups\": [\"/data/prod/ref/fx_rates\"] },\n    { \"id\": \"out_enr\", \"name\": \"dw.txn_enriched\", \"type\": \"Output Table\", \"table\": \"dw.txn_enriched\" }\n  ],\n  \"flows\": [[\"in_raw\", \"join\"], [\"in_cust\", \"join\"], [\"join\", \"rollup\"], [\"rollup\", \"out_enr\"]]\n}\n","graphs/txn_ingest.json":"{\n  \"graph\": \"txn_ingest\",\n  \"project\": \"/Projects/payments\",\n  \"description\": \"Ingest card transactions into the raw zone (external table raw.txn)\",\n  \"components\": [\n    { \"id\": \"in_txn\", \"name\": \"Payments switch feed\", \"type\": \"Read Multiple Files\",\n      \"path\": \"${LANDING}/payments/txn/*.dat\" },\n    { \"id\": \"parse\", \"name\": \"Parse ISO8583\", \"type\": \"Reformat\" },\n    { \"id\": \"out_raw\", \"name\": \"raw txn files\", \"type\": \"Write HDFS\",\n      \"path\": \"hdfs://nameservice1/data/prod/raw/txn/dt=${RUN_DATE}\" }\n  ],\n  \"flows\": [[\"in_txn\", \"parse\"], [\"parse\", \"out_raw\"]]\n}\n","metastore/hive_tables.csv":"db_name,tbl_name,tbl_type,location,owner,comment,partitioned_by,last_ddl_time,view_text\nstg,customer,MANAGED_TABLE,hdfs://nameservice1/warehouse/stg.db/customer,etl_svc,CRM customer staging,,2025-03-01,\nref,region,MANAGED_TABLE,hdfs://nameservice1/warehouse/ref.db/region,etl_svc,Region reference,,2023-06-12,\ndw,customer_dim,MANAGED_TABLE,hdfs://nameservice1/warehouse/dw.db/customer_dim,etl_svc,Customer dimension,,2025-02-10,\nraw,txn,EXTERNAL_TABLE,hdfs://nameservice1/data/prod/raw/txn,etl_svc,Raw card transactions,dt,2024-11-04,\ndw,txn_enriched,MANAGED_TABLE,hdfs://nameservice1/warehouse/dw.db/txn_enriched,etl_svc,Transactions with customer attributes,dt,2025-02-10,\nmart,risk_exposure,MANAGED_TABLE,hdfs://nameservice1/warehouse/mart.db/risk_exposure,risk_svc,Daily exposure by segment,dt,2025-01-22,\nmart,v_risk_latest,VIRTUAL_VIEW,,risk_svc,Latest exposure snapshot,,2025-01-22,\"SELECT * FROM mart.risk_exposure WHERE dt = (SELECT MAX(dt) FROM mart.risk_exposure)\"\nstg,account,MANAGED_TABLE,hdfs://nameservice1/warehouse/stg.db/account,etl_svc,Account master staging,,2025-01-14,\ndw,account_dim,MANAGED_TABLE,hdfs://nameservice1/warehouse/dw.db/account_dim,etl_svc,Account dimension,,2025-02-10,\nmart,fraud_alerts,MANAGED_TABLE,hdfs://nameservice1/warehouse/mart.db/fraud_alerts,fraud_svc,Scored fraud alerts,dt,2025-02-18,\nmart,customer_segments,MANAGED_TABLE,hdfs://nameservice1/warehouse/mart.db/customer_segments,mkt_svc,Monthly customer segments,,2024-12-01,\nmart,v_open_fraud_cases,VIRTUAL_VI
